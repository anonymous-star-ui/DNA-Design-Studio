<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#0b132b"/>
      <stop offset="100%" stop-color="#020617"/>
    </radialGradient>

    <!-- Helix Strand Gradients -->
    <linearGradient id="strandCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>

    <linearGradient id="strandPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="50%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- App Rounded Icon Plate -->
  <rect width="512" height="512" rx="110" fill="url(#bgGlow)" stroke="#38bdf8" stroke-width="4" stroke-opacity="0.25"/>

  <!-- CAD Target Ring & Crosshairs -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="#1e293b" stroke-width="2"/>
  <circle cx="256" cy="256" r="130" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="6 6" stroke-opacity="0.3"/>
  <line x1="256" y1="40" x2="256" y2="90" stroke="#38bdf8" stroke-width="2" stroke-opacity="0.4"/>
  <line x1="256" y1="422" x2="256" y2="472" stroke="#38bdf8" stroke-width="2" stroke-opacity="0.4"/>
  <line x1="40" y1="256" x2="90" y2="256" stroke="#38bdf8" stroke-width="2" stroke-opacity="0.4"/>
  <line x1="422" y1="256" x2="472" y2="256" stroke="#38bdf8" stroke-width="2" stroke-opacity="0.4"/>

  <!-- Rungs (Base Pair Connecting Bridges) -->
  <g stroke-linecap="round" stroke-width="7" opacity="0.85">
    <line x1="170" y1="130" x2="342" y2="130" stroke="#38bdf8"/>
    <line x1="190" y1="180" x2="322" y2="180" stroke="#a855f7"/>
    <line x1="230" y1="230" x2="282" y2="230" stroke="#10b981"/>
    <line x1="250" y1="280" x2="262" y2="280" stroke="#eab308"/>
    <line x1="210" y1="330" x2="302" y2="330" stroke="#ec4899"/>
    <line x1="170" y1="380" x2="342" y2="380" stroke="#06b6d4"/>
  </g>

  <!-- Helix Strand Left (Smooth S-Curves) -->
  <path d="M 160 100 Q 320 220 256 260 T 160 410" fill="none" stroke="url(#strandCyan)" stroke-width="14" stroke-linecap="round" filter="url(#neonGlow)"/>

  <!-- Helix Strand Right (Intertwined S-Curves) -->
  <path d="M 352 100 Q 192 220 256 260 T 352 410" fill="none" stroke="url(#strandPurple)" stroke-width="14" stroke-linecap="round" filter="url(#neonGlow)"/>

  <!-- Molecular Nodes (CPK Base Spheres) -->
  <circle cx="160" cy="100" r="12" fill="#38bdf8" filter="url(#neonGlow)"/>
  <circle cx="352" cy="100" r="12" fill="#f43f5e" filter="url(#neonGlow)"/>
  <circle cx="210" cy="150" r="10" fill="#38bdf8"/>
  <circle cx="302" cy="150" r="10" fill="#a855f7"/>
  <circle cx="256" cy="260" r="11" fill="#ffffff" filter="url(#neonGlow)"/>
  <circle cx="210" cy="360" r="10" fill="#ec4899"/>
  <circle cx="302" cy="360" r="10" fill="#06b6d4"/>
  <circle cx="160" cy="410" r="12" fill="#10b981" filter="url(#neonGlow)"/>
  <circle cx="352" cy="410" r="12" fill="#eab308" filter="url(#neonGlow)"/>
</svg>
